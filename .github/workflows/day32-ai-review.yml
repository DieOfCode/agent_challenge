name: day32-ai-review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: write

jobs:
  ai-review:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Run Day32 review
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          EXTRA_FLAGS=""
          if [ -z "${OPENROUTER_API_KEY}" ]; then
            echo "OPENROUTER_API_KEY is empty -> running in simulate mode"
            EXTRA_FLAGS="-simulate"
          fi

          go run . day32 \
            -from-github-event \
            -event-path "$GITHUB_EVENT_PATH" \
            -base "${{ github.event.pull_request.base.sha }}" \
            -head "${{ github.event.pull_request.head.sha }}" \
            -report DAY32_RESULTS.md \
            ${EXTRA_FLAGS}

      - name: Upload review artifact
        uses: actions/upload-artifact@v4
        with:
          name: day32-review
          path: DAY32_RESULTS.md

      - name: Comment PR with review
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = 'DAY32_RESULTS.md';
            if (!fs.existsSync(path)) {
              core.setFailed('DAY32_RESULTS.md not found');
              return;
            }

            let report = fs.readFileSync(path, 'utf8');
            const maxLen = 60000;
            if (report.length > maxLen) {
              report = report.slice(0, maxLen) + '\n\n... (truncated)';
            }

            const body = `## Day32 AI Review\n\n${report}`;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            });
